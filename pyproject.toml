[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindgames"
dynamic = ["version"]
description = "Minimal, self-contained subset of TextArena for mindgame RL research (selected envs + agents)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "cql" }]
dependencies = [
    "msgspec>=0.20.0",
]

[project.optional-dependencies]
agents = [
  "openai",
  "requests",
  "websockets",
  "transformers",
]
agent-lightning = [
    "agentlightning[apo]>=0.2.0,<0.3",
]
serve = [
    "vllm>=0.15.1,<0.16",
]

[dependency-groups]
dev = [
  "pyyaml>=6.0.0",
  "jsonschema>=4.22.0",
  "wandb>=0.23.1",
]

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.hatch.version]
path = "mindgames/__about__.py"
