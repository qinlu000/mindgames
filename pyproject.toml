[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindgames"
dynamic = ["version"]
description = "Minimal, self-contained mindgame environments."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "cql" }]
dependencies = [
    "msgspec>=0.20.0",
]

[project.optional-dependencies]
agents = [
    "openai",
    "requests",
    "websockets",
    "transformers",
]

[tool.hatch.version]
path = "mindgames/__about__.py"
